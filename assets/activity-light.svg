    .now { animation: grow .8s cubic-bezier(.16,1,.3,1) both, breathe 2.4s ease-in-out 1.6s infinite; }
    @keyframes breathe { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
