<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 419 196" width="419" height="196" role="img" aria-label="My loop, running: eat, sleep, code. Uptime 6y 1m on GitHub, from Tashkent.">
  <title>My loop, running: eat, sleep, code. Uptime 6y 1m on GitHub, from Tashkent.</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .cap { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; }
    .pulse { animation: pulse 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
    .draw { stroke-dasharray: 1; animation: draw 1s cubic-bezier(.6,0,.2,1) both; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 0; } 12% { opacity: 1; } 100% { stroke-dashoffset: 0; } }
    .on { opacity: 0; animation: on 9s linear infinite backwards; }
    @keyframes on { 0% { opacity: 0; } 3%, 33.33% { opacity: 1; } 36.33%, 100% { opacity: 0; } }
    .fill { transform-box: fill-box; transform-origin: left center; animation: fill 9s linear infinite backwards; }
    @keyframes fill { 0% { transform: scaleX(0); } 33.33%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .on { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
