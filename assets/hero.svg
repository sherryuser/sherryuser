<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Shaxriyor Ergashev, full-stack engineer in Tashkent. Marketplaces, Telegram bots and the money logic behind them.">
  <title>Shaxriyor Ergashev, full-stack engineer in Tashkent. Marketplaces, Telegram bots and the money logic behind them.</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    
    .rays { animation: spin 160s linear infinite; transform-origin: 0 0; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .shine { animation: sweep 5.5s ease-in-out infinite; }
    .marker { animation: settle 2.6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { 0%, 55% { transform: skewX(-20deg) translateX(0); } 100% { transform: skewX(-20deg) translateX(520px); } }
    @keyframes settle { from { transform: translateX(248px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/><stop offset=".55" stop-color="#ffcf6b"/><stop offset="1" stop-color="#fff0c2"/>
    </linearGradient>
    <linearGradient id="goldFlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".34"/><stop offset=".6" stop-color="#ff8a1f" stop-opacity=".08"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    
    <clipPath id="frame"><rect width="880" height="360" rx="22"/></clipPath>
    <clipPath id="well"><rect x="562" y="94" width="264" height="104" rx="12"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0a09"/><stop offset=".62" stop-color="#0c0a09" stop-opacity=".86"/><stop offset="1" stop-color="#0c0a09" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="360" fill="#0c0a09"/>
    <g transform="translate(694 180)" fill="#ffb347" opacity=".07"><g class="rays"><path d="M0 0 L520.0 0.0 L516.1 63.4 Z"/><path d="M0 0 L488.6 177.9 L463.3 236.1 Z"/><path d="M0 0 L398.3 334.2 L354.6 380.3 Z"/><path d="M0 0 L260.0 450.3 L203.2 478.7 Z"/><path d="M0 0 L90.3 512.1 L27.2 519.3 Z"/><path d="M0 0 L-90.3 512.1 L-152.0 497.3 Z"/><path d="M0 0 L-260.0 450.3 L-312.9 415.3 Z"/><path d="M0 0 L-398.3 334.2 L-436.1 283.2 Z"/><path d="M0 0 L-488.6 177.9 L-506.7 117.0 Z"/><path d="M0 0 L-520.0 0.0 L-516.1 -63.4 Z"/><path d="M0 0 L-488.6 -177.9 L-463.3 -236.1 Z"/><path d="M0 0 L-398.3 -334.2 L-354.6 -380.3 Z"/><path d="M0 0 L-260.0 -450.3 L-203.2 -478.7 Z"/><path d="M0 0 L-90.3 -512.1 L-27.2 -519.3 Z"/><path d="M0 0 L90.3 -512.1 L152.0 -497.3 Z"/><path d="M0 0 L260.0 -450.3 L312.9 -415.3 Z"/><path d="M0 0 L398.3 -334.2 L436.1 -283.2 Z"/><path d="M0 0 L488.6 -177.9 L506.7 -117.0 Z"/></g></g>
    <circle cx="694" cy="180" r="300" fill="url(#glow)"/>
    <rect width="620" height="360" fill="url(#fade)"/>

    <!-- who -->
    <circle cx="48" cy="62" r="4" fill="#7ee2a8"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="62" y="66" class="sans" font-size="11.5" font-weight="700" letter-spacing="1.7" fill="#a6998a">TASHKENT, UZBEKISTAN  ·  FULL-STACK ENGINEER</text>
    <text x="42" y="138" class="sans" font-size="64" font-weight="800" letter-spacing="-2" fill="#f7efe6">Shaxriyor</text>
    <text x="42" y="204" class="sans" font-size="64" font-weight="800" letter-spacing="-2" fill="url(#gold)">Ergashev</text>
    <text class="sans" font-size="16.5" fill="#d8cbbb">
      <tspan x="44" y="246">Marketplaces, Telegram bots and the money logic behind</tspan>
      <tspan x="44" y="270">them. Most of it lives in the CS2 skin economy.</tspan>
    </text>
    <g transform="translate(44 296)">
      <rect width="282" height="34" rx="10" fill="#15110e" stroke="rgba(255,190,120,.16)"/>
      <text x="14" y="22" class="mono" font-size="13.5" fill="#a6998a"><tspan fill="#ffcf6b">$</tspan> eat() &amp;&amp; sleep() &amp;&amp; <tspan fill="#f7efe6">code()</tspan></text>
      <rect class="caret" x="262" y="9" width="8" height="16" rx="1.5" fill="#ffcf6b"/>
    </g>

    <!-- the inspect card -->
    <g>
      <rect x="548" y="36" width="292" height="288" rx="18" fill="#15110e" stroke="rgba(255,190,120,.30)"/>
      <text x="566" y="66" class="sans" font-size="15" font-weight="800" fill="#f7efe6">★ sherryuser</text>
      <text x="566" y="83" class="sans" font-size="11.5" fill="#a6998a">Full-Stack  |  Factory New</text>
      <g transform="translate(762 52)">
        <rect width="60" height="20" rx="10" fill="rgba(235,75,75,.12)" stroke="rgba(235,75,75,.55)"/>
        <text x="30" y="14" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#ff8f8f">Covert</text>
      </g>

      <rect x="562" y="94" width="264" height="104" rx="12" fill="#0e0b09"/>
      <g clip-path="url(#well)">
        <ellipse cx="694" cy="148" rx="120" ry="58" fill="url(#glow)"/>
        <text x="694" y="167" text-anchor="middle" class="mono" font-size="58" font-weight="700" fill="url(#gold)">&lt;/&gt;</text>
        <path d="M826 94 h-30 l30 30 z" fill="#ffcf6b"/>
        <rect class="shine" x="428" y="76" width="90" height="150" fill="url(#shine)" transform="skewX(-20)"/>
      </g>

      <text x="566" y="216" class="sans" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8f8376">FLOAT</text>
      <text x="822" y="216" text-anchor="end" class="mono" font-size="11.5" fill="#f7efe6">0.00070</text>
      <rect x="566.0" y="226" width="16.4" height="4" rx="2" fill="#4fd08b"/>
      <rect x="583.9" y="226" width="19.0" height="4" rx="2" fill="#9bd65a"/>
      <rect x="604.4" y="226" width="57.4" height="4" rx="2" fill="#f1c84b"/>
      <rect x="663.3" y="226" width="16.4" height="4" rx="2" fill="#f08a3c"/>
      <rect x="681.2" y="226" width="139.3" height="4" rx="2" fill="#e5484d"/>
      <g class="marker"><rect x="568" y="222" width="3" height="12" rx="1.5" fill="#fff"/></g>

      <g class="sans" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8f8376">
        <text x="566" y="258">PATTERN</text>
        <text x="658" y="258">CONTRIBUTIONS / YR</text>
      </g>
      <g class="mono" font-size="14" font-weight="700" fill="#f7efe6">
        <text x="566" y="276">2020</text>
        <text x="658" y="276" fill="#ffcf6b">742</text>
      </g>
      <g><rect x="566" y="288" width="34" height="24" rx="7" fill="#0e0b09" stroke="#4b69ff" stroke-opacity=".7"/><text x="583" y="304" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4b69ff">TS</text></g>
      <g><rect x="606" y="288" width="34" height="24" rx="7" fill="#0e0b09" stroke="#4fc3d9" stroke-opacity=".7"/><text x="623" y="304" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4fc3d9">GO</text></g>
      <g><rect x="646" y="288" width="34" height="24" rx="7" fill="#0e0b09" stroke="#7ee2a8" stroke-opacity=".7"/><text x="663" y="304" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#7ee2a8">VUE</text></g>
      <g><rect x="686" y="288" width="34" height="24" rx="7" fill="#0e0b09" stroke="#ffcf6b" stroke-opacity=".7"/><text x="703" y="304" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ffcf6b">PY</text></g>
      <text x="822" y="304" text-anchor="end" class="sans" font-size="10" fill="#8f8376">4 stickers applied</text>
    </g>
    <rect x=".5" y=".5" width="879" height="359" rx="21.5" fill="none" stroke="rgba(255,190,120,.16)"/>
  </g>
</svg>
