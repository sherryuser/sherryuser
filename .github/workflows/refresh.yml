# Reads fresh figures from GitHub once a day, redraws the profile's images, and commits them when
# something changed. It can also be run by hand: Actions tab, "Refresh the profile", Run workflow.
name: Refresh the profile

on:
  schedule:
    - cron: '23 0 * * *' # every day at 05:23 in Tashkent
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the figures and redraw the images
        run: node scripts/build.mjs --refresh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit, if anything changed
        run: |
          git add data assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the figures"
          git push
